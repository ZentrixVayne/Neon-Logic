<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynapseX</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Space Mono & Anton SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton+SC&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Space Mono"', 'monospace'],
              serif: ['"Space Mono"', 'monospace'],
              mono: ['"Space Mono"', 'monospace'],
              display: ['"Anton SC"', 'sans-serif']
            }
          }
        }
      }
    </script>

    <!-- React & ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Framer Motion UMD -->
    <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
    
    <!-- Babel for Transpiling JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      :root {
        --font-sans: "Space Mono", monospace;
        --font-serif: "Space Mono", monospace;
        --font-mono: "Space Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: #000;
        color: #fff;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: "Space Mono", monospace;
      }
      /* Lenis Smooth Scroll Utilities */
      .lenis.lenis-smooth { scroll-behavior: auto !important; }
      .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
      .lenis.lenis-stopped { overflow: hidden; }
      .lenis.lenis-scrolling iframe { pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef } = React;
        const { motion, useScroll, useSpring, useTransform, useMotionTemplate, AnimatePresence } = window.Motion || window.FramerMotion || {};
        const { createRoot } = ReactDOM;

        // --- Video URLs ---
        const VIDEOS = {
          hero: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_083515_290e5a10-0b95-41af-a5e2-32b6389baa4d.mp4",
          sec2: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_092455_089c54f8-3b03-4966-9df1-e9746063d0ef.mp4",
          sec3: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_095810_ecea3dd2-fc5e-4e41-8696-4219290b6589.mp4",
          sec4: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_095750_32a52ce0-2005-45c9-9093-41f03fde9530.mp4",
          footer: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_080203_fd7f4f85-3a86-4837-8192-85e7bfe68e75.mp4"
        };

        // --- Helper Components ---

        const ScrambleIn = ({ text, delay, triggered }) => {
          const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+~|}{[]:;?><";
          const [display, setDisplay] = useState('\u00A0');

          useEffect(() => {
            if (!triggered) {
              setDisplay('\u00A0');
              return;
            }

            let frame = 0;
            let interval;

            const timeout = setTimeout(() => {
              interval = setInterval(() => {
                let current = '';
                const revealCount = frame * 0.5;
                for (let i = 0; i < text.length; i++) {
                  if (text[i] === ' ') {
                    current += ' ';
                    continue;
                  }
                  if (i < Math.floor(revealCount)) {
                    current += text[i];
                  } else if (i < Math.floor(revealCount) + 3) {
                    current += chars[Math.floor(Math.random() * chars.length)];
                  } else {
                    current += '';
                  }
                }
                setDisplay(current);
                frame++;
                if (Math.floor(revealCount) >= text.length) {
                  clearInterval(interval);
                  setDisplay(text);
                }
              }, 25);
            }, delay);

            return () => {
              clearTimeout(timeout);
              if (interval) clearInterval(interval);
            };
          }, [triggered, text, delay]);

          return <span>{display}</span>;
        };

        const ScrambleText = ({ text, isHovered, className }) => {
          const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+~|}{[]:;?><";
          const [display, setDisplay] = useState(text);

          useEffect(() => {
            if (!isHovered) {
              setDisplay(text);
              return;
            }

            let frame = 0;
            const interval = setInterval(() => {
              let current = '';
              const revealCount = frame / 4;
              for (let i = 0; i < text.length; i++) {
                if (text[i] === ' ') {
                  current += ' ';
                  continue;
                }
                if (i < Math.floor(revealCount)) {
                  current += text[i];
                } else {
                  current += chars[Math.floor(Math.random() * chars.length)];
                }
              }
              setDisplay(current);
              frame++;
              if (Math.floor(revealCount) >= text.length) {
                clearInterval(interval);
                setDisplay(text);
              }
            }, 25);

            return () => clearInterval(interval);
          }, [isHovered, text]);

          return <span className={className}>{display}</span>;
        };

        const SynapseXLogo = ({ className }) => {
          const path = "M 1.5,23 L 1.5,33 C 1.5,38.5 6,43 11.5,43 L 16.5,43 C 22,43 26.5,38.5 26.5,33 Q 28,28 33,26.5 C 38.5,26.5 43,22 43,16.5 L 43,11.5 C 43,6 38.5,1.5 33,1.5 L 23,1.5 Q 12,12 1.5,23 Z";
          return (
            <svg viewBox="-50 -50 100 100" className={className} fill="currentColor">
              <path d={path} transform="rotate(0)" />
              <path d={path} transform="rotate(90)" />
              <path d={path} transform="rotate(180)" />
              <path d={path} transform="rotate(270)" />
            </svg>
          );
        };

        const SquashHamburger = ({ isOpen, isMobile = false }) => {
          const w = isMobile ? 15 : 18;
          const h = isMobile ? 10 : 12;
          const barH = isMobile ? 1.2 : 1.5;
          const midY = (h - barH) / 2;

          return (
            <div className="relative" style={{ width: w, height: h }}>
              <motion.span
                className="absolute left-0 bg-white"
                style={{ width: '100%', height: barH, top: 0 }}
                animate={{ y: isOpen ? midY : 0, rotate: isOpen ? 45 : 0 }}
                transition={{ type: 'spring', stiffness: 300, damping: 20 }}
              />
              <motion.span
                className="absolute left-0 bg-white"
                style={{ width: '100%', height: barH, top: midY }}
                animate={{ opacity: isOpen ? 0 : 1, scale: isOpen ? 0 : 1 }}
                transition={{ type: 'spring', stiffness: 300, damping: 20 }}
              />
              <motion.span
                className="absolute left-0 bg-white"
                style={{ width: '100%', height: barH, top: h - barH }}
                animate={{ y: isOpen ? -midY : 0, rotate: isOpen ? -45 : 0 }}
                transition={{ type: 'spring', stiffness: 300, damping: 20 }}
              />
            </div>
          );
        };

        // --- Navbar ---
        const Navbar = ({ entranceComplete }) => {
          const [menuOpen, setMenuOpen] = useState(false);
          const [hoverDownload, setHoverDownload] = useState(false);
          const [hoverAbout, setHoverAbout] = useState(false);
          const [hoverMetrics, setHoverMetrics] = useState(false);

          const scrollToSection = (index) => {
            window.scrollTo({ top: window.innerHeight * index, behavior: 'smooth' });
          };

          return (
            <>
              {/* Desktop Navbar */}
              <motion.nav
                initial={{ opacity: 0 }}
                animate={{ opacity: entranceComplete ? 1 : 0 }}
                transition={{ duration: 0.8 }}
                className="fixed top-0 left-0 w-full h-20 z-50 hidden md:flex items-center justify-between px-6"
              >
                <div className="flex items-center gap-2">
                  <motion.div
                    className={`flex items-center h-12 px-5 bg-white/15 backdrop-blur-md rounded-[14px] cursor-pointer ${menuOpen ? 'hidden' : 'flex'}`}
                    whileHover={{ scale: 1.02, backgroundColor: 'rgba(255,255,255,0.22)' }}
                    whileTap={{ scale: 0.98 }}
                  >
                    <SynapseXLogo className="w-[18px] h-[18px] text-white mr-2" />
                    <span className="text-white text-base font-medium tracking-tight">SynapseX</span>
                  </motion.div>

                  <motion.div
                    animate={{ width: menuOpen ? 290 : 48 }}
                    transition={{ type: 'spring', stiffness: 350, damping: 28 }}
                    className="relative h-12 rounded-[14px] bg-white/15 backdrop-blur-md flex items-center overflow-hidden"
                  >
                    <motion.button
                      onClick={() => setMenuOpen(!menuOpen)}
                      animate={{ width: menuOpen ? 36 : 48, height: menuOpen ? 36 : 48, borderRadius: menuOpen ? 11 : 14, marginLeft: menuOpen ? 6 : 0, backgroundColor: menuOpen ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0)' }}
                      whileHover={menuOpen ? { backgroundColor: 'rgba(255,255,255,0.2)' } : {}}
                      className="relative flex items-center justify-center z-10 flex-shrink-0"
                    >
                      <SquashHamburger isOpen={menuOpen} />
                    </motion.button>

                    <div className="absolute top-0 left-0 h-full flex items-center pl-[52px] pr-5">
                      <motion.div
                        initial={{ opacity: 0 }}
                        animate={{ opacity: menuOpen ? 1 : 0, x: menuOpen ? 0 : 15 }}
                        transition={{ duration: 0.3 }}
                        className="flex items-center gap-6"
                      >
                        <button
                          className="text-white/85 hover:text-white text-base font-normal"
                          onMouseEnter={() => setHoverAbout(true)}
                          onMouseLeave={() => setHoverAbout(false)}
                          onClick={() => scrollToSection(1)}
                        >
                          <ScrambleText text="About" isHovered={hoverAbout} />
                        </button>
                        <button
                          className="text-white/85 hover:text-white text-base font-normal"
                          onMouseEnter={() => setHoverMetrics(true)}
                          onMouseLeave={() => setHoverMetrics(false)}
                          onClick={() => scrollToSection(2)}
                        >
                          <ScrambleText text="Metrics" isHovered={hoverMetrics} />
                        </button>
                      </motion.div>
                    </div>
                  </motion.div>
                </div>

                <motion.button
                  whileHover={{ scale: 1.03, backgroundColor: '#e2e2e6' }}
                  whileTap={{ scale: 0.97 }}
                  className="h-12 px-6 bg-white text-black rounded-full flex items-center gap-2"
                  onMouseEnter={() => setHoverDownload(true)}
                  onMouseLeave={() => setHoverDownload(false)}
                >
                  <i className="bi bi-apple text-base"></i>
                  <ScrambleText text="Download" isHovered={hoverDownload} className="text-sm font-medium" />
                </motion.button>
              </motion.nav>

              {/* Mobile Navbar */}
              <motion.nav
                initial={{ opacity: 0 }}
                animate={{ opacity: entranceComplete ? 1 : 0 }}
                transition={{ duration: 0.8 }}
                className="fixed top-0 left-0 w-full z-50 flex md:hidden items-center justify-between px-4 py-4"
              >
                <div className="flex items-center gap-2 flex-1">
                  <motion.div
                    animate={{ width: menuOpen ? 0 : 'auto' }}
                    transition={{ type: 'spring', stiffness: 350, damping: 28 }}
                    className="overflow-hidden whitespace-nowrap flex items-center h-9 px-3.5 bg-white/15 backdrop-blur-md rounded-[10px]"
                  >
                    <SynapseXLogo className="w-3.5 h-3.5 text-white mr-1.5" />
                    <span className="text-white text-[13px] font-medium">SynapseX</span>
                  </motion.div>

                  <motion.div
                    animate={{ width: menuOpen ? '100%' : 36 }}
                    transition={{ type: 'spring', stiffness: 350, damping: 28 }}
                    className="h-9 rounded-[10px] bg-white/15 backdrop-blur-md flex items-center overflow-hidden"
                  >
                    <button onClick={() => setMenuOpen(!menuOpen)} className="w-9 h-9 flex items-center justify-center flex-shrink-0">
                      <SquashHamburger isOpen={menuOpen} isMobile={true} />
                    </button>
                    {menuOpen && (
                      <div className="flex items-center gap-4 px-4 text-[13px] text-white/85">
                        <button onClick={() => scrollToSection(1)}>About</button>
                        <button onClick={() => scrollToSection(2)}>Metrics</button>
                      </div>
                    )}
                  </motion.div>
                </div>

                <motion.button
                  whileHover={{ scale: 1.03 }}
                  whileTap={{ scale: 0.97 }}
                  className="h-9 px-3.5 bg-white text-black rounded-full text-[13px] font-medium ml-2 flex items-center gap-1"
                >
                  <i className="bi bi-apple"></i> Download
                </motion.button>
              </motion.nav>
            </>
          );
        };

        // --- Main App ---
        const App = () => {
          const [entranceComplete, setEntranceComplete] = useState(false);
          
          // Hero video scrubbing
          const heroVideoRef = useRef(null);
          const targetTime = useRef(0);
          const isSeeking = useRef(false);

          const handleSeek = () => {
            const video = heroVideoRef.current;
            if (!video || !video.duration || isNaN(video.duration)) return;

            if (Math.abs(video.currentTime - targetTime.current) > 0.05) {
              isSeeking.current = true;
              video.currentTime = targetTime.current;
            } else {
              isSeeking.current = false;
            }
          };

          useEffect(() => {
            const timer = setTimeout(() => setEntranceComplete(true), 800);
            
            const video = heroVideoRef.current;
            if (!video) return;

            const onLoadedMetadata = () => {
              video.pause();
              video.currentTime = 0;
              targetTime.current = 0;
            };
            
            const onSeeked = () => {
              isSeeking.current = false;
              handleSeek();
            };

            const onMouseMove = (e) => {
              if (!video || !video.duration) return;
              const delta = e.movementX * 0.8 * 0.01; // Scale down for usability
              targetTime.current = Math.max(0, Math.min(video.duration, targetTime.current + delta));
              if (!isSeeking.current) {
                handleSeek();
              }
            };

            video.addEventListener('loadedmetadata', onLoadedMetadata);
            video.addEventListener('seeked', onSeeked);
            window.addEventListener('mousemove', onMouseMove);

            return () => {
              clearTimeout(timer);
              video.removeEventListener('loadedmetadata', onLoadedMetadata);
              video.removeEventListener('seeked', onSeeked);
              window.removeEventListener('mousemove', onMouseMove);
            };
          }, []);

          // Section 2 scroll animation
          const section2Ref = useRef(null);
          const { scrollYProgress } = useScroll({
            target: section2Ref,
            offset: ["start end", "end start"]
          });
          
          const smoothProgress = useSpring(scrollYProgress, { stiffness: 15, damping: 32, mass: 1.8 });
          const yScale = useTransform(smoothProgress, [0, 1], [60, -120]);
          const textOpacity = useTransform(smoothProgress, [0.3, 0.5], [0, 1]);
          const transform = useMotionTemplate`rotateX(24deg) translateY(${yScale}px) translateZ(15px)`;

          return (
            <div style={{ fontFamily: '"Space Mono", monospace' }} className="bg-black text-white">
              <Navbar entranceComplete={entranceComplete} />

              {/* SECTION 1: Hero */}
              <section className="relative h-[100dvh] w-full overflow-hidden">
                <video
                  ref={heroVideoRef}
                  src={VIDEOS.hero}
                  className="absolute inset-0 w-full h-full object-cover"
                  muted
                  playsInline
                  preload="auto"
                />
                <div className="absolute inset-0 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#ffffff 1px, transparent 1px)', backgroundSize: '24px 24px', opacity: 0.05 }} />
                
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style={{ marginTop: '50px' }}>
                  <h1 className="uppercase whitespace-nowrap" style={{ fontFamily: '"Anton SC", sans-serif', fontSize: 'clamp(120px, 30vw, 521px)', letterSpacing: '-4px', opacity: 0.10, color: 'transparent', backgroundImage: 'radial-gradient(circle, rgba(142,127,148,0) 0%, #8E7F94 70%)', WebkitBackgroundClip: 'text', backgroundClip: 'text' }}>
                    TRANSCENDENCE
                  </h1>
                </div>

                <div className="relative z-10 flex flex-col h-[100dvh] px-4 sm:px-6 md:px-8 pt-20 sm:pt-24 pb-8 sm:pb-12">
                  <div className="flex-1"></div>
                  <div className="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
                    <div className="flex flex-col gap-4">
                      <h1 className="text-white font-light leading-[0.95] tracking-[-0.03em]" style={{ fontSize: 'clamp(40px, 10vw, 100px)' }}>
                        <ScrambleIn text="Brain" delay={200} triggered={entranceComplete} /><br/>
                        <ScrambleIn text="And Body" delay={500} triggered={entranceComplete} />
                      </h1>
                      <motion.p
                        initial={{ opacity: 0, y: 25 }}
                        animate={entranceComplete ? { opacity: 1, y: 0 } : {}}
                        transition={{ duration: 0.9, ease: [0.215, 0.610, 0.355, 1.000], delay: 0.2 }}
                        className="max-w-sm text-[13px] sm:text-[15px] text-white/60 leading-relaxed"
                      >
                        Built at the intersection of neuroscience and artificial intelligence. SynapseX continuously maps neural pathways, cognitive load, and physiological states into a single adaptive intelligence layer.
                      </motion.p>
                    </div>
                    <h1 className="text-white font-light leading-[0.95] tracking-[-0.03em] text-left md:text-right" style={{ fontSize: 'clamp(40px, 10vw, 100px)' }}>
                      <ScrambleIn text="One" delay={700} triggered={entranceComplete} /><br/>
                      <ScrambleIn text="Network" delay={1000} triggered={entranceComplete} />
                    </h1>
                  </div>
                </div>
              </section>

              {/* SECTION 2: Cinematic Text */}
              <section ref={section2Ref} className="relative h-[100dvh] w-full overflow-hidden flex items-center justify-center" style={{ perspective: 400 }}>
                <video src={VIDEOS.sec2} autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover" />
                <div className="absolute top-0 left-0 w-full h-[180px] bg-gradient-to-b from-[#010103] to-transparent z-10" />
                <motion.div style={{ transform, opacity: textOpacity }} className="relative z-20 max-w-5xl px-6 sm:px-12">
                  <p className="font-sans font-normal text-center select-none" style={{ fontSize: 'clamp(22px, 4vw, 42px)', lineHeight: 1.35, letterSpacing: '-0.02em' }}>
                    A neural-AI interface built on the architecture of the human nervous system. SynapseX translates synaptic activity into computational intelligence. Every signal becomes measurable, structured, and visible. It continuously reconstructs internal state as a dynamic neural map. Biological noise is filtered into actionable cognitive patterns.
                  </p>
                </motion.div>
              </section>

              {/* SECTION 3: Metrics */}
              <section className="relative min-h-screen w-full flex flex-col items-center justify-center pt-32 pb-32 px-6 overflow-hidden">
                <video src={VIDEOS.sec3} autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover z-0" />
                <div className="relative z-10 w-full max-w-6xl flex flex-col items-center">
                  <motion.h2
                    initial={{ opacity: 0 }}
                    whileInView={{ opacity: 1 }}
                    transition={{ duration: 1.2 }}
                    viewport={{ once: true, amount: 0.3 }}
                    className="text-white/40 text-[13px] sm:text-[14px] tracking-[0.2em] uppercase mb-20 text-center"
                  >
                    Performance Metrics
                  </motion.h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-16 md:gap-8 w-full">
                    {[
                      { val: "2.4ms", label: "Synaptic Latency" },
                      { val: "99.7%", label: "Signal Accuracy" },
                      { val: "140B", label: "Neural Parameters" }
                    ].map((m, i) => (
                      <motion.div
                        key={m.label}
                        initial={{ opacity: 0, y: 30 }}
                        whileInView={{ opacity: 1, y: 0 }}
                        transition={{ duration: 0.8, delay: i * 0.15 }}
                        viewport={{ once: true }}
                        className="flex flex-col items-center text-center"
                      >
                        <span className="text-white font-light tracking-[-0.04em] leading-none" style={{ fontSize: 'clamp(48px, 10vw, 96px)' }}>{m.val}</span>
                        <span className="text-white/40 text-[13px] sm:text-[15px] mt-4 tracking-wide">{m.label}</span>
                      </motion.div>
                    ))}
                  </div>
                </div>
              </section>

              {/* SECTION 4: Technology */}
              <section className="relative h-[100dvh] w-full flex flex-col px-8 sm:px-12 md:px-16 py-12 sm:py-16 overflow-hidden">
                <video src={VIDEOS.sec4} autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover z-0" />
                <div className="relative z-10 flex flex-col h-full">
                  <div className="flex flex-col md:flex-row md:justify-between md:items-start gap-6">
                    <motion.h2
                      initial={{ opacity: 0, y: 40 }}
                      whileInView={{ opacity: 1, y: 0 }}
                      transition={{ duration: 1.0 }}
                      viewport={{ once: true, amount: 0.3 }}
                      className="text-white font-light leading-[0.95] tracking-[-0.03em]"
                      style={{ fontSize: 'clamp(36px, 8vw, 72px)' }}
                    >
                      Adaptive<br/>Intelligence
                    </motion.h2>
                    <motion.p
                      initial={{ opacity: 0, y: 20 }}
                      whileInView={{ opacity: 1, y: 0 }}
                      transition={{ duration: 1.0, delay: 0.2 }}
                      viewport={{ once: true, amount: 0.3 }}
                      className="text-white/50 text-[13px] sm:text-[15px] leading-relaxed max-w-xs md:text-right md:pt-2"
                    >
                      The system learns your neural baseline within 72 hours. From there, every cognitive state is mapped, predicted, and optimized in real time.
                    </motion.p>
                  </div>

                  <div className="flex-1"></div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-6">
                    {[
                      { title: "Cortical Mapping", desc: "Real-time spatial reconstruction of active neural regions." },
                      { title: "Signal Isolation", desc: "Separates cognitive intent from biological noise." },
                      { title: "State Prediction", desc: "Anticipates cognitive transitions before they occur." },
                      { title: "Loop Feedback", desc: "Closed-loop adjustment based on outcome correlation." }
                    ].map((item, i) => (
                      <motion.div
                        key={item.title}
                        initial={{ opacity: 0, y: 20 }}
                        whileInView={{ opacity: 1, y: 0 }}
                        transition={{ duration: 0.7, delay: i * 0.1 }}
                        viewport={{ once: true }}
                        className="flex flex-col"
                      >
                        <h3 className="text-white text-[14px] sm:text-[16px] font-normal mb-2">{item.title}</h3>
                        <p className="text-white/40 text-[12px] sm:text-[14px] leading-relaxed">{item.desc}</p>
                      </motion.div>
                    ))}
                  </div>
                </div>
              </section>

              {/* SECTION 5: Architecture */}
              <section className="relative min-h-screen w-full flex flex-col items-center justify-center max-w-3xl mx-auto px-6 py-32 bg-black z-10">
                <motion.div
                  initial={{ opacity: 0, y: 30 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  transition={{ duration: 1.0 }}
                  viewport={{ once: true, amount: 0.4 }}
                  className="flex flex-col items-center text-center mb-20"
                >
                  <span className="text-white/40 text-[13px] sm:text-[14px] tracking-[0.2em] uppercase mb-8">Architecture</span>
                  <h2 className="text-white font-light leading-[1.15] tracking-[-0.02em] mb-10" style={{ fontSize: 'clamp(28px, 6vw, 56px)' }}>
                    Three layers. Zero friction.
                  </h2>
                  <p className="text-white/45 text-[15px] sm:text-[17px] leading-relaxed max-w-xl mx-auto">
                    Sensor layer captures raw bioelectric signals. Processing layer isolates intent. Interface layer delivers structured output to any connected system.
                  </p>
                </motion.div>

                <motion.div
                  initial={{ opacity: 0 }}
                  whileInView={{ opacity: 1 }}
                  transition={{ duration: 1.2, delay: 0.4 }}
                  viewport={{ once: true, amount: 0.4 }}
                  className="flex flex-col items-center gap-4 w-full"
                >
                  {["Capture", "Process", "Interface"].map((layer, i) => (
                    <div key={i} className="w-full max-w-md h-[72px] border border-white/10 rounded-lg flex items-center justify-between px-6">
                      <span className="text-white/30 text-[12px] tracking-[0.15em] uppercase">Layer {i+1}</span>
                      <span className="text-white text-[16px] sm:text-[18px] font-light">{layer}</span>
                    </div>
                  ))}
                </motion.div>
              </section>

              {/* FOOTER */}
              <footer className="bg-black overflow-hidden flex flex-col md:flex-row min-h-[400px]">
                <div className="w-full md:w-1/2 h-[300px] md:h-auto">
                  <video src={VIDEOS.footer} autoPlay muted loop playsInline className="w-full h-full object-cover" />
                </div>
                <div className="w-full md:w-1/2 flex flex-col justify-between p-10 sm:p-16">
                  <div>
                    <div className="flex items-center mb-8">
                      <SynapseXLogo className="w-[18px] h-[18px] text-white/70 mr-2" />
                      <span className="text-white/70 text-[15px] font-medium tracking-tight">SynapseX</span>
                    </div>
                    <p className="text-white/40 text-[14px] sm:text-[15px] leading-relaxed max-w-sm">
                      The next evolution of human-machine interaction. Built for those who refuse to be limited by biology alone.
                    </p>
                  </div>
                  <div className="text-white/25 text-[12px] mt-12">
                    (c) 2026 SynapseX Labs. All rights reserved.
                  </div>
                </div>
              </footer>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
